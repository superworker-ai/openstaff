name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: server
            target: server
            dockerfile: docker/app.Dockerfile
          - image: web
            target: web
            dockerfile: docker/app.Dockerfile
          - image: computer
            target: ''
            dockerfile: docker/computer/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/openstaff-${{ matrix.image }}:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/openstaff-${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/openstaff-${{ matrix.image }}:sha-${{ github.sha }}
          artifact-name: sbom-${{ matrix.image }}.spdx.json
  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - name: Extract matching changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v section="## ${version}" '$0 == section { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836
        with:
          generate_release_notes: false
          body_path: release-notes.md
