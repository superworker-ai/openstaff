services:
  litestream:
    image: litestream/litestream:0.3.13
    entrypoint: ["/bin/sh", "/opt/openstaff/litestream-entrypoint.sh"]
    command: ["replicate", "-config", "/tmp/litestream.yml"]
    environment:
      S3_PROVIDER: ${S3_PROVIDER:-other}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-workspace/}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    volumes:
      - data:/data
      - ./docker/litestream-entrypoint.sh:/opt/openstaff/litestream-entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
